services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: attendance
      POSTGRES_USER: attendance
      POSTGRES_PASSWORD: attendance-dev-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attendance -d attendance"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://attendance:attendance-dev-only@db:5432/attendance
      JWT_SECRET: dev-only-jwt-secret-not-for-production-7f3a9c
      CODE_SECRET: dev-only-code-secret-not-for-production-b81e4d
      ACCESS_TOKEN_MINUTES: 30
      # Development only. Give this to professors so they can create accounts; change it for any real deployment.
      PROFESSOR_SIGNUP_CODE: professor-dev-only
      UPLOAD_DIR: /data/uploads
      # Login role Grafana uses; the app creates it and lets it read only the reporting views.
      REPORTING_DB_PASSWORD: grafana-reader-dev-only
    volumes:
      - uploads:/data/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  grafana:
    image: grafana/grafana-oss:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      # Development only: change for any real deployment.
      GF_SECURITY_ADMIN_PASSWORD: grafana-dev-only
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/overview.json
      REPORTING_DB_HOST: db:5432
      REPORTING_DB_NAME: attendance
      REPORTING_DB_USER: grafana_reader
      REPORTING_DB_PASSWORD: grafana-reader-dev-only
      REPORTING_DB_SSLMODE: disable
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  uploads:
  grafana_data:
