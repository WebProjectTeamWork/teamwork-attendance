# Render Blueprint: free web service built from the Dockerfile. See docs/deploy-free.md.
services:
  - type: web
    name: teamwork-attendance
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      # Asked for when the Blueprint is created: the Neon connection string, starting postgresql+psycopg://
      - key: DATABASE_URL
        sync: false
      - key: PROFESSOR_SIGNUP_CODE
        sync: false
      # Random values generated by Render once, then kept.
      - key: JWT_SECRET
        generateValue: true
      - key: CODE_SECRET
        generateValue: true
      # The free plan has 512 MB RAM: a sheet scan then peaks at about 430 MB instead of about 600 MB.
      - key: OCR_MAX_SIDE
        value: "1400"
      - key: OCR_THREADS
        value: "1"
